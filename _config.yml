title: "TGM Guide"
description: "A classic Japanese strategy guide to Tetris: The Grand Master, TAP and Ti, with English translations."
baseurl: "/tgm-tips-rebuilt"
url: "https://octopuserectus.github.io"

# Language sections are the top-level directories en, en-vd and jp.
# Chapter order and titles live in _data/chapters.yml, UI strings in _data/locales.yml.

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
