---
title: "Tetris: The Grand Master series guide"
layout: landing
---

<div class="landing">
  <h1 class="site-title">Tetris: The Grand Master <span>series guide</span></h1>
  <div class="title-images">
    <img src="{{ '/assets/images/title/tgm1_title.png' | relative_url }}" alt="Tetris: The Grand Master title screen" width="320" height="240">
    <img src="{{ '/assets/images/title/tgm2_title.png' | relative_url }}" alt="Tetris: The Absolute – The Grand Master 2 PLUS title screen" width="320" height="240">
    <img src="{{ '/assets/images/title/tgm3_title.png' | relative_url }}" alt="Tetris: The Grand Master 3 – Terror-Instinct title screen" width="320" height="240">
  </div>

  <h2 class="landing__choose">Select Language <span lang="ja">／ 言語を選択</span></h2>
  <ul class="language-selector">
    {%- for locale in site.data.locales %}
    {%- assign path = '/' | append: locale[0] | append: '/' %}
    <li>
      <a href="{{ path | relative_url }}" hreflang="{{ locale[1].html_lang }}">
        <strong lang="{{ locale[1].html_lang }}">{{ locale[1].label_long }}</strong>
      </a>
    </li>
    {%- endfor %}
  </ul>
</div>
